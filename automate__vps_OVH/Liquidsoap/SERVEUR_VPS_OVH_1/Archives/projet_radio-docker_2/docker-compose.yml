services:
  liquidsoap:
    image: savonet/liquidsoap:v2.4.2
    container_name: liquidsoap_2
    restart: no
    command: /etc/liquidsoap/script.liq
    volumes:
      - /home/ubuntu/projet_radio/Musique:/music
      - /home/ubuntu/projet_radio-docker:/etc/liquidsoap
    networks:
      airvs-network:
        aliases:
          - liquidsoap_2.my
networks:
  airvs-network:

    driver: bridge
