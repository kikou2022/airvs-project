<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirVS Dashboard — Connexion</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <style>
        body {
            background-color: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .login-card h1 {
            color: #e94560;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        .login-card p {
            color: #8899aa;
            text-align: center;
            margin-bottom: 28px;
            font-size: 0.9rem;
        }
        .form-control {
            background: #0f3460;
            border: 1px solid #1a4080;
            color: #ffffff;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
        }
        .form-control:focus {
            background: #1a4080;
            border-color: #e94560;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(233, 69, 96, 0.25);
        }
        .form-control::placeholder {
            color: #556677;
        }
        .btn-login {
            background: #e94560;
            border: none;
            color: #ffffff;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #c73652;
            color: #ffffff;
        }
        .alert-danger {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.4);
            color: #ff6b81;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>AirVS Dashboard</h1>
        <p>Entrez votre mot de passe pour accéder au tableau de bord</p>

        {% if erreur %}
        <div class="alert alert-danger" role="alert">
            {{ erreur }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Mot de passe"
                       autofocus
                       required>
            </div>
            <button type="submit" class="btn btn-login">Se connecter</button>
        </form>
    </div>
</body>
</html>
